  <title>Rafflesia Online</title>
  <style>
    /* created: 2026-11-23T12:11:00-08:00 */
    :root { font-family: "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; color: #eaf4ff;
      background:
        radial-gradient(circle at 20% 10%, rgba(50,140,255,.35), transparent 40%),
        radial-gradient(circle at 80% 0%, rgba(20,90,220,.4), transparent 45%),
        linear-gradient(160deg, #041022 0%, #0a2a5c 55%, #071830 100%);
    }
    .shell { min-height: 100svh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card {
      width: min(420px, 100%); padding: 24px 20px 28px; border-radius: 20px;
      background: rgba(20,60,120,.35); border: 1px solid rgba(140,200,255,.35);
      box-shadow: 0 12px 40px rgba(0,20,60,.45); backdrop-filter: blur(14px); text-align:center;
    }
    .logo { width: min(220px,70%); border-radius:16px; margin:0 auto 12px; display:block; }
    h1 { margin:0 0 4px; font-size:1.5rem; color:#f2f8ff; }
    .tag { margin:0 0 18px; color:#9ec9ff; font-size:.92rem; }
    .tabs { display:flex; gap:8px; margin-bottom:14px; }
    .tabs button {
      flex:1; border:1px solid rgba(140,200,255,.3); background:rgba(8,30,70,.45);
      color:#cfe6ff; border-radius:999px; padding:8px 10px; cursor:pointer; font:inherit;
    }
    .tabs button.active { background:rgba(60,140,255,.45); border-color:rgba(160,220,255,.7); color:#fff; }
    form { display:grid; gap:10px; text-align:left; }
    label { display:grid; gap:4px; color:#d7ebff; font-size:.85rem; }
    input {
      border-radius:10px; border:1px solid rgba(140,200,255,.35); background:rgba(4,18,42,.65);
      color:#f5f9ff; padding:10px 12px; font:inherit;
    }
    .primary {
      margin-top:6px; border:0; border-radius:12px; padding:12px 14px;
      background:linear-gradient(135deg,#3a8dff,#1f5fd6); color:#fff; font:inherit; font-weight:600; cursor:pointer;
    }
    .primary:disabled { opacity:.6; }
    .error { margin:10px 0 0; color:#ffb4b4; font-size:.88rem; }
    .ghost {
      border:1px solid rgba(140,200,255,.4); background:transparent; color:#e8f3ff;
      border-radius:12px; padding:10px 14px; font:inherit; cursor:pointer;
    }
    .home p { margin:8px 0 16px; color:#cfe6ff; }
    .hidden { display:none !important; }
  </style>

      <h1>Rafflesia Online</h1>
      <p class="tag">Rafflesia Channel Entertainment</p>

      <div id="authPanel">
        <div class="tabs">
          <button type="button" id="btnSignup" class="active">Sign up</button>
          <button type="button" id="btnLogin">Log in</button>
        </div>
        <form id="authForm">
          <label id="displayWrap">Display name
            <input id="displayName" placeholder="What friends see" autocomplete="nickname" />
          </label>
          <label>Username
            <input id="username" placeholder="yourname" autocomplete="username" required />
          </label>
          <label>Password
            <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" required />
          </label>
          <button class="primary" id="submitBtn" type="submit">Create account</button>
        </form>
        <p class="error hidden" id="errorBox"></p>
      </div>

      <div id="homePanel" class="home hidden">
        <p id="welcomeText">Welcome!</p>
        <p>Your messaging home is starting here.</p>
        <button class="ghost" type="button" id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script>
    // created: 2026-11-23T12:11:00-08:00
    const SUPABASE_URL = 'https://btzgwfcnpnhtfnfxauqe.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_CMi6DLa0Meqcnv8MJoHwSg_gt9dtBPg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mode = 'signup';

    const authPanel = document.getElementById('authPanel');
    const homePanel = document.getElementById('homePanel');
    const displayWrap = document.getElementById('displayWrap');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    const welcomeText = document.getElementById('welcomeText');

    function toAuthEmail(username) {
      return username.trim().toLowerCase() + '@rafflesia.local';
    }

    function showError(msg) {
      errorBox.textContent = msg || '';
      errorBox.classList.toggle('hidden', !msg);
    }

    function setMode(next) {
      mode = next;
      document.getElementById('btnSignup').classList.toggle('active', mode === 'signup');
      document.getElementById('btnLogin').classList.toggle('active', mode === 'login');
      displayWrap.classList.toggle('hidden', mode !== 'signup');
      submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Log in';
      showError('');
    }

    async function showUser(user) {
      if (!user) {
        authPanel.classList.remove('hidden');
        homePanel.classList.add('hidden');
        return;
      }
      const { data } = await supabase.from('profiles').select('display_name, username').eq('id', user.id).maybeSingle();
      welcomeText.textContent = 'Welcome, ' + ((data && (data.display_name || data.username)) || 'friend') + '!';
      authPanel.classList.add('hidden');
      homePanel.classList.remove('hidden');
    }

    document.getElementById('btnSignup').onclick = () => setMode('signup');
    document.getElementById('btnLogin').onclick = () => setMode('login');
    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut();
      showUser(null);
    };

    document.getElementById('authForm').onsubmit = async (e) => {
      e.preventDefault();
      showError('');
      submitBtn.disabled = true;
      const username = document.getElementById('username').value.trim().toLowerCase();
      const displayName = document.getElementById('displayName').value.trim() || username;
      const password = document.getElementById('password').value;
      try {
        if (!username || !password) throw new Error('Please enter a username and password.');
        if (username.includes(' ') || username.includes('@')) throw new Error('Username cannot have spaces or @.');
        const email = toAuthEmail(username);
        if (mode === 'signup') {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;
          if (!data.user) throw new Error('Could not create account.');
          const { error: profileError } = await supabase.from('profiles').insert({
            id: data.user.id,
            username,
            display_name: displayName,
            bio: ''
          });
          if (profileError) throw profileError;
          await showUser(data.user);
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          await showUser(data.user);
        }
      } catch (err) {
        showError(err.message || 'Something went wrong.');
      } finally {
        submitBtn.disabled = false;
      }
    };

    supabase.auth.getSession().then(({ data }) => showUser(data.session && data.session.user));
    supabase.auth.onAuthStateChange((_e, session) => showUser(session && session.user));
  </script>
