# created: 2026-11-23T19:02:00-08:00
# updated: 2026-11-23T21:58:00-08:00 — branch deploy (bypasses stuck Actions Pages lock)
# Deploy Rafflesia Online to GitHub Pages via gh-pages branch
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # created: 2026-11-23T19:02:00-08:00
        uses: actions/checkout@v4
      - name: Setup Node
        # created: 2026-11-23T19:02:00-08:00
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        # created: 2026-11-23T19:02:00-08:00
        run: npm ci
      - name: Build
        # created: 2026-11-23T19:02:00-08:00
        # updated: 2026-11-23T21:58:00-08:00 — publish to gh-pages branch
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Publish to gh-pages branch
        # created: 2026-11-23T21:58:00-08:00
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
