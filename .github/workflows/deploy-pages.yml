# created: 2026-11-23T19:02:00-08:00
# Deploy Rafflesia Online to GitHub Pages (school Chromebooks allow *.github.io)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # created: 2026-11-23T19:02:00-08:00
        uses: actions/checkout@v4
      - name: Setup Node
        # created: 2026-11-23T19:02:00-08:00
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        # created: 2026-11-23T19:02:00-08:00
        run: npm ci
      - name: Build
        # created: 2026-11-23T19:02:00-08:00
        # updated: 2026-11-23T19:03:00-08:00 — uses committed .env.production (publishable key)
        run: npm run build
      - name: Upload Pages artifact
        # created: 2026-11-23T19:02:00-08:00
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        # created: 2026-11-23T19:02:00-08:00
        id: deployment
        uses: actions/deploy-pages@v4
